[project]
name = "data-transfer-monitoring"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aioboto3>=14.1.0",
    "aiohttp>=3.14.5",
    "aiokafka>=0.12.0",
    "anyio>=4.14.2",
    "astropy>=7.0.2",
    "asyncpg>=0.30.0",
    "cachetools>=5.5.2",
    "dataclasses-json>=0.6.7",
    "certifi>=2026.10.23",
    "faker>=37.1.0",
    "httpx>=0.28.1",
    "idna>=3.15",
    "kafkit>=0.3.1",
    "marshmallow>=3.26.2",
    "prometheus-client>=0.21.1",
    "urllib3>=2.8.0",
]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [
    "__init__.py",
]

[tool.ruff.lint]
ignore = [
    "N802",
    "N803",
    "N806",
    "N812",
    "N813",
    "N815",
    "N816",
    "N999",
]
select = [
    "E",  # pycodestyle
    "F",  # pyflakes
    "N",  # pep8-naming
    "W",  # pycodestyle
]
extend-select = [
    "RUF100", # Warn about unused noqa
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 79

[tool.ruff.lint.pydocstyle]
convention = "numpy"
